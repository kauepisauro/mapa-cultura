# O plano gratuito do Supabase pausa o projeto após ~1 semana sem uso.
# Este job faz uma leitura leve por semana para manter o banco ativo.
# Só age depois que supabaseUrl/supabaseAnonKey estiverem preenchidos em js/config.js.
name: Manter banco ativo
on:
  schedule:
    - cron: '17 9 * * 1,4'   # segundas e quintas, 09:17 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ler a configuração e fazer a consulta
        run: |
          URL=$(grep -oP "supabaseUrl:\s*'\K[^']+" js/config.js || true)
          KEY=$(grep -oP "supabaseAnonKey:\s*'\K[^']+" js/config.js || true)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Banco ainda não configurado; nada a fazer."; exit 0; fi
          curl -fsS "${URL%/}/rest/v1/pontos?select=id&status=eq.aprovado&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" > /dev/null
          echo "Banco respondeu."
