<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Painel pessoal</title>
  <meta name="description" content="Painel pessoal de compromissos: perícias, mestrado e artes num só lugar.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#E8E3D1">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Painel">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400..800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/pessoal.css">
</head>
<body>
<div id="app">
  <header class="topo">
    <div class="topo__titulo">
      <small class="mono" id="data-hoje"></small>
      <h1>Painel</h1>
    </div>
    <div class="topo__acoes">
      <button class="btn btn--forte" data-acao="novo">+ Novo</button>
      <button class="btn btn--icone" data-acao="mais" aria-label="Mais opções (backup, agenda, tema)">⋯</button>
    </div>
  </header>
  <nav class="abas" id="abas" aria-label="Seções"></nav>
  <main id="vista" tabindex="-1"></main>
</div>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="arquivo" accept="application/json,.json" hidden>
<script type="module" src="js/app.js"></script>
</body>
</html>
